version: "3.9"

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api:
    build: .
    # Start the FastAPI server listening on all network interfaces (0.0.0.0)
    command: fastapi run app.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  worker:
    build: .
    # Start the RQ worker and point it to the Redis container
    command: rq worker default --url redis://redis:6379
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis